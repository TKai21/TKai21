<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <style>
    .bg { fill: #0d1117; }
    .node { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
    .label { fill: #c9d1d9; font-size: 13px; }
    .sub { fill: #8b949e; font-size: 10px; }
    .title { fill: #e6edf3; font-size: 22px; font-weight: 600; }
    .tag { fill: #8b949e; font-size: 12px; }
    .wire { stroke: #30363d; stroke-width: 2; fill: none; }
    .pulse { fill: #58a6ff; }
    .check { stroke: #3fb950; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round;
             stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw 6s infinite; }
    .retry { stroke: #d29922; stroke-width: 1.5; fill: none; stroke-dasharray: 4 4;
             opacity: 0; animation: retry 6s infinite; }
    .cursor { fill: #58a6ff; animation: blink 1s steps(2) infinite; }
    @keyframes draw  { 0%,70% { stroke-dashoffset: 40; } 80%,100% { stroke-dashoffset: 0; } }
    @keyframes retry { 0%,50% { opacity: 0; } 55%,65% { opacity: 1; } 70%,100% { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-color-scheme: light) {
      .bg { fill: #ffffff; } .node { fill: #f6f8fa; stroke: #d0d7de; }
      .label { fill: #24292f; } .title { fill: #1f2328; } .wire { stroke: #d0d7de; }
    }
  </style>

  <rect class="bg" width="900" height="200" rx="12"/>

  <text class="title" x="40" y="48">Kai · LLM agents that have to be correct<tspan class="cursor">_</tspan></text>
  <text class="tag" x="40" y="72">retrieval · structured generation · validation — for industrial &amp; networked systems</text>

  <!-- pipeline nodes -->
  <g transform="translate(40,105)">
    <rect class="node" x="0"   y="0" width="150" height="56" rx="8"/>
    <rect class="node" x="210" y="0" width="150" height="56" rx="8"/>
    <rect class="node" x="420" y="0" width="150" height="56" rx="8"/>
    <rect class="node" x="630" y="0" width="150" height="56" rx="8"/>

    <text class="label" x="75"  y="25" text-anchor="middle">NL request</text>
    <text class="sub"   x="75"  y="42" text-anchor="middle">"run temp sweep on lot 42"</text>
    <text class="label" x="285" y="25" text-anchor="middle">retrieve</text>
    <text class="sub"   x="285" y="42" text-anchor="middle">BM25 + dense · 7k-page spec</text>
    <text class="label" x="495" y="25" text-anchor="middle">generate</text>
    <text class="sub"   x="495" y="42" text-anchor="middle">structured tool-use output</text>
    <text class="label" x="705" y="25" text-anchor="middle">validate</text>
    <text class="sub"   x="705" y="42" text-anchor="middle">schema + graph + LLM judge</text>

    <path class="wire" d="M150 28 H210"/>
    <path class="wire" d="M360 28 H420"/>
    <path class="wire" d="M570 28 H630"/>

    <!-- self-correct loop: validate -> generate -->
    <path class="retry" d="M705 56 V72 H495 V56"/>

    <!-- pulse travelling through the pipeline -->
    <circle class="pulse" r="5">
      <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0.45;0.45;0.6;0.6;1;1" keyTimes="0;0.35;0.5;0.55;0.65;0.8;1" calcMode="linear"
        path="M75 28 H705 M705 28 H495 M495 28 H705 H705"/>
    </circle>

    <!-- checkmark drawn when validation passes -->
    <path class="check" d="M790 28 l9 9 l17 -18"/>
  </g>
</svg>
